[project]
name = "essaywriter"
version = "0.1.0"
description = "An essay-writing agent that plans, researches, drafts and revises."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.4",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.5.0",
]

[project.scripts]
essaywriter = "essaywriter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["essaywriter"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
